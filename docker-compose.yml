services:
  news-aggregator:
    build: .
    image: news-aggregator
    ports:
      - '${HOST_PORT:-8080}:8080'
    # Optional: copy .env.example to .env and set NEWS_MODE=live plus all keys.
    env_file:
      - path: .env
        required: false
    # Overrides any PORT in .env so the container always matches the mapping above.
    environment:
      PORT: '8080'
    init: true
