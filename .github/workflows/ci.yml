name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  e2e:
    name: E2E (Demo build)
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  docker:
    name: Docker smoke
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build --tag news-desk .
      - run: docker run --detach --name news-desk --publish 8080:8080 news-desk
      - name: Wait for the health check
        run: |
          for _ in $(seq 1 30); do
            curl --fail --silent http://localhost:8080/api/health && exit 0
            sleep 1
          done
          exit 1
      - name: Check Demo mode, deep links and API 404s
        run: |
          curl --fail --silent http://localhost:8080/api/health | grep -q '"mode":"demo"'
          curl --fail --silent http://localhost:8080/preferences | grep -q '<div id="root">'
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://localhost:8080/api/unknown)" = 404
      - name: Check the Demo feed and its pagination
        run: |
          feed=$(curl --fail --silent 'http://localhost:8080/api/feed?source=guardian&source=nyt')
          echo "$feed" | jq -e '.mode == "demo" and (.articles | length) > 0 and (.nextCursor | type) == "string"'
          cursor=$(echo "$feed" | jq -r .nextCursor)
          curl --fail --silent --get --data-urlencode "cursor=$cursor" \
            'http://localhost:8080/api/feed?source=guardian&source=nyt' \
            | jq -e '.providerStatuses | length == 3'
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' 'http://localhost:8080/api/feed?from=2026-02-30')" = 400
      - if: always()
        run: docker logs news-desk

  deploy:
    name: Deploy production
    needs: [quality, e2e, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_CLI: vercel@58.7.1
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm dlx "$VERCEL_CLI" pull --yes --environment=production --token="$VERCEL_TOKEN"
      - run: pnpm dlx "$VERCEL_CLI" build --prod --token="$VERCEL_TOKEN"
      - run: pnpm dlx "$VERCEL_CLI" deploy --prebuilt --prod --token="$VERCEL_TOKEN"
