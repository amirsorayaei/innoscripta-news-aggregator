name: Set up project
description: Install the pinned pnpm, Node.js 22 and locked dependencies.
runs:
  using: composite
  steps:
    # Reads the exact pnpm version from "packageManager" in package.json.
    - uses: pnpm/action-setup@v6
    - uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        cache: pnpm
    - run: pnpm install --frozen-lockfile
      shell: bash
